<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#050608" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Last Light" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <title>LAST LIGHT</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; background:#020304; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; overscroll-behavior:none; }
    body { display:flex; justify-content:center; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
    .wrap { width:min(100%,520px); padding:12px; }
    #stage { position:relative; width:100%; aspect-ratio:3/4; overflow:hidden; border-radius:18px; background:#050608; border:1px solid rgba(255,255,255,.1); touch-action:none; user-select:none; -webkit-user-select:none; }
    canvas { width:100%; height:100%; display:block; }
    #ui { position:absolute; inset:0; pointer-events:none; }
    #top { position:absolute; top:12px; left:12px; right:12px; display:flex; gap:10px; align-items:center; }
    #meter { flex:1; height:14px; border-radius:999px; background:rgba(255,255,255,.08); overflow:hidden; border:1px solid rgba(255,255,255,.12); }
    #fill { height:100%; width:100%; background:linear-gradient(90deg,#65572c,#fff1a7); }
    #score { font-size:14px; font-weight:800; text-shadow:0 1px 6px #000; }
    #message { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:min(86%,420px); text-align:center; pointer-events:auto; }
    #message h1 { font-size:30px; margin:0 0 8px; letter-spacing:.06em; }
    #message p { color:rgba(255,255,255,.78); font-size:14px; line-height:1.45; }
    button { appearance:none; -webkit-appearance:none; min-height:48px; padding:0 18px; border-radius:14px; border:1px solid rgba(255,255,255,.16); background:#1b1d20; color:white; font-weight:800; font-size:16px; }
    .bottom { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-top:10px; color:rgba(255,255,255,.65); font-size:13px; }
    .hint { text-align:center; color:rgba(255,255,255,.45); font-size:12px; margin-top:8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="stage" aria-label="Last Light game area">
      <canvas id="game"></canvas>
      <div id="ui">
        <div id="top"><div id="meter"><div id="fill"></div></div><div id="score">0</div></div>
        <div id="message">
          <h1>LAST LIGHT</h1>
          <p>Your light is your life, your vision, and your weapon.<br>Drag to move. Tap an enemy to fire. Every shot costs light.</p>
          <button id="start" type="button">Enter the dark</button>
        </div>
      </div>
    </div>
    <div class="bottom"><span>Best: <strong id="best">0</strong></span><button id="restart" type="button">Restart</button></div>
    <div class="hint">Enemies only become visible inside your shrinking pool of light.</div>
  </div>
<script>
(() => {
  const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage'), msg = document.getElementById('message');
  const fill = document.getElementById('fill'), scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  const startBtn = document.getElementById('start'), restartBtn = document.getElementById('restart');
  let W=360,H=480,dpr=1,running=false,last=0,anim=0,player,bullets,enemies,orbs,score,spawnTimer,dragTarget=null;
  let best = Number(localStorage.getItem('lastLightBest')||0); bestEl.textContent=best;
  function resize(){ const r=stage.getBoundingClientRect(); dpr=Math.min(devicePixelRatio||1,2); W=Math.max(280,r.width); H=Math.max(360,r.height); canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); }
  function reset(){ resize(); player={x:W/2,y:H*.68,r:10,light:100,speed:185}; bullets=[]; enemies=[]; orbs=[]; score=0; spawnTimer=0; dragTarget=null; hud(); }
  function hud(){ fill.style.width=Math.max(0,player?player.light:100)+'%'; scoreEl.textContent=Math.floor(score||0); }
  function start(){ reset(); running=true; msg.style.display='none'; last=performance.now(); cancelAnimationFrame(anim); anim=requestAnimationFrame(loop); }
  function over(){ running=false; best=Math.max(best,Math.floor(score)); localStorage.setItem('lastLightBest',best); bestEl.textContent=best; msg.innerHTML='<h1>LIGHT OUT</h1><p>You lasted <strong>'+Math.floor(score)+'</strong> seconds.<br>Go again?</p><button id="again" type="button">Try again</button>'; msg.style.display='block'; document.getElementById('again').addEventListener('click',start); }
  function spawn(){ const edge=Math.floor(Math.random()*4); let x,y; if(edge===0){x=Math.random()*W;y=-20}else if(edge===1){x=W+20;y=Math.random()*H}else if(edge===2){x=Math.random()*W;y=H+20}else{x=-20;y=Math.random()*H}; const t=Math.min(1,score/90); enemies.push({x,y,r:9+Math.random()*5,speed:38+Math.random()*24+t*34,hp:1,phase:Math.random()*6.28}); }
  function shoot(tx,ty){ if(!running||player.light<=3.5)return; const dx=tx-player.x,dy=ty-player.y,d=Math.hypot(dx,dy)||1; bullets.push({x:player.x,y:player.y,vx:dx/d*420,vy:dy/d*420,r:3,life:1.1}); player.light=Math.max(0,player.light-4); hud(); }
  function pos(e){ const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
  stage.addEventListener('pointerdown',e=>{ if(!running)return; const p=pos(e); let hit=null,bestD=34; for(const en of enemies){const d=Math.hypot(en.x-p.x,en.y-p.y); if(d<bestD){bestD=d;hit=en}} if(hit){shoot(hit.x,hit.y);dragTarget=null}else dragTarget=p; stage.setPointerCapture?.(e.pointerId); });
  stage.addEventListener('pointermove',e=>{if(running&&dragTarget)dragTarget=pos(e)}); stage.addEventListener('pointerup',()=>dragTarget=null); stage.addEventListener('pointercancel',()=>dragTarget=null);
  startBtn.addEventListener('click',start); restartBtn.addEventListener('click',start); window.addEventListener('resize',resize);
  function update(dt){ score+=dt; player.light-=dt*(.34+Math.min(.55,score/180)); if(player.light<=0){player.light=0;hud();over();return;} if(dragTarget){const dx=dragTarget.x-player.x,dy=dragTarget.y-player.y,d=Math.hypot(dx,dy); if(d>4){const s=Math.min(d,player.speed*dt);player.x+=dx/d*s;player.y+=dy/d*s}} player.x=Math.max(player.r,Math.min(W-player.r,player.x)); player.y=Math.max(player.r+26,Math.min(H-player.r,player.y)); spawnTimer-=dt; if(spawnTimer<=0){spawn();spawnTimer=Math.max(.32,1.18-score*.008)*(.75+Math.random()*.5)} for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt} bullets=bullets.filter(b=>b.life>0&&b.x>-10&&b.x<W+10&&b.y>-10&&b.y<H+10); for(const en of enemies){const dx=player.x-en.x,dy=player.y-en.y,d=Math.hypot(dx,dy)||1; en.x+=dx/d*en.speed*dt;en.y+=dy/d*en.speed*dt;en.phase+=dt*4;if(d<player.r+en.r)player.light-=23*dt;} for(const b of bullets){for(const en of enemies){if(en.hp>0&&Math.hypot(b.x-en.x,b.y-en.y)<b.r+en.r){en.hp=0;b.life=0;orbs.push({x:en.x,y:en.y,r:6,life:8});score+=1.5;break}}} enemies=enemies.filter(e=>e.hp>0); for(const o of orbs){o.life-=dt;const dx=player.x-o.x,dy=player.y-o.y,d=Math.hypot(dx,dy)||1;if(d<85){o.x+=dx/d*130*dt;o.y+=dy/d*130*dt}if(d<player.r+o.r+4){o.life=-1;player.light=Math.min(100,player.light+12);score+=.75}} orbs=orbs.filter(o=>o.life>0); hud(); }
  function draw(){ ctx.clearRect(0,0,W,H);ctx.fillStyle='#030405';ctx.fillRect(0,0,W,H); const radius=55+player.light*1.45; const g=ctx.createRadialGradient(player.x,player.y,0,player.x,player.y,radius);g.addColorStop(0,'rgba(255,245,187,.95)');g.addColorStop(.16,'rgba(255,229,133,.38)');g.addColorStop(.58,'rgba(160,140,80,.11)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H); for(const o of orbs){const og=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,18);og.addColorStop(0,'rgba(255,244,176,.95)');og.addColorStop(1,'rgba(255,214,90,0)');ctx.fillStyle=og;ctx.beginPath();ctx.arc(o.x,o.y,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,245,190,.95)';ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill()} for(const en of enemies){const d=Math.hypot(en.x-player.x,en.y-player.y);const vis=Math.max(0,1-d/radius);if(vis<=.03)continue;ctx.globalAlpha=Math.min(1,vis*1.8);ctx.fillStyle='rgba(90,95,105,.9)';ctx.beginPath();ctx.arc(en.x,en.y,en.r*(1+Math.sin(en.phase)*.04),0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(220,220,225,.75)';ctx.beginPath();ctx.arc(en.x-en.r*.28,en.y-en.r*.08,1.5,0,Math.PI*2);ctx.arc(en.x+en.r*.28,en.y-en.r*.08,1.5,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1} for(const b of bullets){ctx.fillStyle='rgba(255,244,178,.98)';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill()} const pg=ctx.createRadialGradient(player.x,player.y,0,player.x,player.y,22);pg.addColorStop(0,'rgba(255,252,220,1)');pg.addColorStop(1,'rgba(255,220,90,0)');ctx.fillStyle=pg;ctx.beginPath();ctx.arc(player.x,player.y,22,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff7cf';ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill(); }
  function loop(t){ if(!running)return; const dt=Math.min(.033,(t-last)/1000||.016);last=t;update(dt);draw();if(running)anim=requestAnimationFrame(loop); }
  reset();draw();
  if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
